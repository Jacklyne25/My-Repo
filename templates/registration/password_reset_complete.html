{% extends "base.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<style>
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
    }

    .glass-card {
        background: #358ce3;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(253, 250, 250, 0.1);
        border-radius: 1.5rem;
        padding: 3rem;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
    }

    .login-header h2 {
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 1rem;
        color: #fff;
    }

    .login-header p {
        color: #f8f8f9;
        font-size: 1rem;
        line-height: 1.5;
        margin-bottom: 2rem;
    }

    .btn-submit {
        display: inline-block;
        padding: 0.875rem 2rem;
        background: linear-gradient(135deg, var(--primary, #4f46e5) 0%, var(--primary-hover, #4338ca) 100%);
        border: none;
        border-radius: 0.75rem;
        color: white;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.2s;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-submit:hover {
        transform: translateY(-2px);
    }
</style>

<div class="login-wrapper">
    <div class="glass-card">
        <div class="login-header">
            <h2>Password Reset Complete</h2>
            <p>Your password has been set successfully. You may go ahead and log in now.</p>
        </div>
        <a href="{% url 'login' %}" class="btn-submit">Log in to your account</a>
    </div>
</div>
{% endblock %}
