{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<style>
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        perspective: 1000px;
    }

    .glass-card {
        background: #358ce3;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(253, 250, 250, 0.1);
        border-radius: 1.5rem;
        padding: 3rem;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .login-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .login-header h2 {
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .login-header p {
        color: #f8f8f9;
        font-size: 0.875rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #eff3f7;
    }

    .form-input {
        width: 100%;
        padding: 0.75rem 1rem;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        color: var(--text);
        font-size: 1rem;
        box-sizing: border-box;
    }

    .form-input:focus {
        outline: none;
        border-color: var(--primary);
        background: rgba(245, 246, 249, 0.8);
    }

    .btn-submit {
        width: 100%;
        padding: 0.875rem;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
        border: none;
        border-radius: 0.75rem;
        color: white;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 1rem;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
    }
</style>

<div class="login-wrapper">
    <div class="glass-card">
        <div class="login-header">
            <h2>Reset Password</h2>
            <p>Enter your email address to receive a password reset link.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_email">Email Address</label>
                <div class="input-container">
                    <input type="email" name="email" id="id_email" required class="form-input"
                        placeholder="Enter your email">
                </div>
            </div>
            <button type="submit" class="btn-submit">
                <span class="btn-text">Send Reset Link</span>
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center;">
            <p style="color: #030000; font-size: 1.0rem;">
                Remembered your password? <a href="{% url 'login' %}"
                    style="color: #fefdff; text-decoration: none; font-weight: 600;">Sign in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
